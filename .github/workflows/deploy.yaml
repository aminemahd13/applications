  name: Deploy to production

  # Rebuild the production app containers on every push to main. The actual
  # pull + `docker compose up -d --build api web` runs on the VPS; this job only
  # triggers it over SSH using a locked-down, forced-command deploy key.
  on:
    push:
      branches: [main]
    workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

  # Never run two production deploys at once; queue them instead of overlapping.
  concurrency:
    group: production-deploy
    cancel-in-progress: false

  jobs:
    deploy:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      steps:
        - name: Trigger VPS deploy over SSH
          env:
            DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          run: |
            set -euo pipefail
            mkdir -p ~/.ssh
            printf "%s\n" "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            # Pinned host key (no TOFU): the VPS ed25519 host key.
            echo "51.222.106.93 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG32C6KfvwOEREId+pOjfm4+XV7h0KjdmZuYmvjK+0pc" > ~/.ssh/known_hosts
            # The key is pinned to a forced command on the server, so no remote
            # command is sent here; the server runs the deploy and streams output.
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=20 amine@51.222.106.93