worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Docker DNS resolver for service discovery updates when scaled.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    upstream app_web {
        least_conn;
        server web:3000 resolve;
        keepalive 128;
    }

    upstream app_assets {
        server minio:9000 resolve;
        keepalive 64;
    }

    # Uploaded files are served from the app origin: sandbox everything except
    # PDFs (the browser PDF viewer does not run in sandboxed documents).
    # An empty value makes add_header skip the header.
    map $upstream_http_content_type $uploads_csp {
        # Exactly application/pdf (optional params, no comma): browsers use the
        # last comma-separated value, so "application/pdf,text/html" is HTML.
        "~*^application/pdf\s*(;[^,]*)?$" "";
        default "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'";
    }

    server {
        listen 80;
        server_name localhost;

        # Signed object storage URLs (applicant files and microsite/certificate
        # assets). Caching comes from the signed response-cache-control
        # override; applicant files must not be cached publicly.
        location /uploads/ {
            # Presigned PUTs go through here; nginx's 1 MB default would reject
            # uploads. 160m covers the largest asset (microsite media, 150 MB).
            client_max_body_size 160m;
            proxy_pass http://app_assets/uploads/;
            proxy_set_header Host $host;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Type-Options;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy $uploads_csp always;
        }

        # API responses can include long-running ZIP exports via web proxy.
        location /api/v1/ {
            proxy_pass http://app_web;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # Frontend Routing (Catch-all)
        location / {
            proxy_pass http://app_web;
        }
    }
}
